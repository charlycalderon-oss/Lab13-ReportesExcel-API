name: Build and Publish .NET Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Lab13.Api/Lab13.Api.csproj

    - name: Build application
      run: dotnet build Lab13.Api/Lab13.Api.csproj --configuration Release --no-restore

    - name: Publish application
      run: dotnet publish Lab13.Api/Lab13.Api.csproj --configuration Release --output ./published --no-build
